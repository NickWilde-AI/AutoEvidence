[project]
name = "autoevidence"
version = "0.1.0"
description = "智能汽车质量分析模型 — 引证式 SFT + GRPO"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AutoEvidence" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "orjson>=3.10",
  "tenacity>=8.3",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
  "datasets>=2.20",
  "peft>=0.12",
  "trl>=0.11",
  "safetensors>=0.4",
]
vision = [
  "pillow>=10.0",
  "torchvision>=0.17",
]
serve = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
all = [
  "autoevidence[train,vision,serve,dev]",
]

[project.scripts]
autoevidence = "autoevidence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling 自动识别 src/autoevidence

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
default-groups = []
